[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-edge-mdm"
version = "0.1.0"
description = "Project EDGE scientific MDM data foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==1.5.3",
]

[project.scripts]
edge-mdm = "edge_mdm.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["edge_mdm*", "edge_research*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--basetemp=tests/.pytest_tmp"
